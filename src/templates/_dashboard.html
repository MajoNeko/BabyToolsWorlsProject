{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
  <script src="https://use.fontawesome.com/releases/v5.15.4/js/all.js" data-auto-replace-svg></script>
  <title>Homepage</title>
</head>

<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg bt-navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">
        <i class="fas fa-baby me-2"></i>
        BabyTools World
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/">
              Homepage
            </a>
          </li>
        </ul>
        {% if user.is_authenticated %}

        <a class="btn btn-oat btn-space" href="#">
          {{ user.username }}
        </a>

        <button class="btn btn-blush" type="submit" form="logout">
          Sign Out
        </button>
        <form action="{% url 'logout' %}" method="POST" id="logout">
          {% csrf_token %}
        </form>
        {% else %}

        <a class="btn btn-sage btn-space" href="/users/register">
          Sign Up
        </a>
        <a class="btn btn-blue" href="/users/login">
          Sign In
        </a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="flex-grow-1">
    {% block content %}
    {% endblock %}
  </main>

  {% block footer %}
  <footer class="mt-auto bt-footer">
    {% include "footer.html" %}
  </footer>
  {% endblock %}
</body>

</html>
